<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Payment Approvals - SINA Admin Portal</title>
  <meta name="theme-color" content="#4C1D95">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>

  <main class="admin-container">
    <div class="page-header-row">
      <div>
        <h1 class="page-title">Payment Verification & Approvals</h1>
        <p class="page-subtitle">Verify UPI transaction UTRs and audit bank transfer passbook/cheque image uploads.</p>
      </div>
    </div>

    <!-- Approvals Feed Container -->
    <div id="approvals-container">
      <div class="card text-center text-muted" style="padding: 24px;">Loading pending payment submissions...</div>
    </div>
  </main>

  <!-- High-Res Image Inspection Modal -->
  <div id="approval-img-modal" class="sina-modal-backdrop" onclick="closeApprovalImg()">
    <div class="sina-modal-card" style="padding: 14px; text-align: center;" onclick="event.stopPropagation()">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
        <span class="status-badge active">Passbook / Cheque Document Audit</span>
        <button class="icon-btn" onclick="closeApprovalImg()">&times;</button>
      </div>
      <img id="approval-full-img" src="" style="width: 100%; max-height: 75vh; object-fit: contain; border-radius: var(--radius-md);" alt="Full Proof">
    </div>
  </div>

  <!-- Scripts -->
  <script src="js/config.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/db.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/approvals.js"></script>
</body>
</html>
